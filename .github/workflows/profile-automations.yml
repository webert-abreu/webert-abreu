# Salve em: .github/workflows/profile-automations.yml (no repositório webert-abreu/webert-abreu)
name: Automações do perfil

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00ff41&color_dots=#0d1117,#003b00,#008f11,#00c832,#00ff41

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/blog-post-workflow@v1
        continue-on-error: true # se o YouTube falhar, tenta de novo na próxima execução
        with:
          comment_tag_name: YOUTUBE
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCrtqjXrQo4TvjY0J7IFYDLg"
          retry_count: 3
          retry_wait_time: 15
          max_post_count: 4
          template: '<a href="$url"><img width="30%" src="$youtubeThumbnailUrl" alt="$title" /></a> '
